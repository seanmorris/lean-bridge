name: Installed dependent checked records in Perl

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependent-checked-record-perl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependent-checked-record-perl:
    name: Four ABI dependent checked-record CPAN matrix
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential curl git libgmp-dev libuv1-dev zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/dependent-checked-record-perl-toolchain.log
      - name: Restore the checksummed Perl ABI matrix
        uses: actions/cache@v4
        with:
          path: .toolchains/perl
          key: perl-dependent-checked-record-abi-v1-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
      - name: Build or verify every pinned Perl interpreter
        timeout-minutes: 45
        shell: bash
        run: |
          set -euo pipefail
          node scripts/build-perl-toolchains.mjs 5.36.3 threaded
          node scripts/build-perl-toolchains.mjs 5.36.3 unthreaded
          node scripts/build-perl-toolchains.mjs 5.38.2 threaded
          node scripts/build-perl-toolchains.mjs 5.38.2 unthreaded
      - name: Require every source route and API mode across each Perl ABI
        id: acceptance
        timeout-minutes: 180
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-dependent-checked-record-perl-ci.sh
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependent-checked-record-perl-${{ github.sha }}
          path: |
            build/dependent-checked-record-perl-ci/
            build/dependent-checked-record-perl-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed dependent checked-record Perl acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
