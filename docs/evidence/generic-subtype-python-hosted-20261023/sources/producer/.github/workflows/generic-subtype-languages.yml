name: Generic Subtypes in Python, Ruby and Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-subtype-languages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Ordinary and reviewed generic Subtypes on Python 3.11 and 3.12
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select Python 3.11
        id: python311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select Python 3.12
        id: python312
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and package dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config python3-venv ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/generic-subtype-python-toolchain.log
      - name: Execute installed Python acceptance
        id: acceptance
        timeout-minutes: 125
        env:
          PYTHON311: ${{ steps.python311.outputs.python-path }}
          PYTHON312: ${{ steps.python312.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-generic-subtype-python-ci.sh "$PYTHON311" "$PYTHON312"
      - name: Preserve complete and partial Python records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-subtype-python-${{ github.sha }}
          path: |
            build/generic-subtype-python-ci/
            build/generic-subtype-python-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Python acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  ruby:
    name: Ordinary and reviewed generic Subtypes on Ruby 3.3
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and package dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/generic-subtype-ruby-toolchain.log
      - name: Execute installed Ruby acceptance
        id: acceptance
        timeout-minutes: 125
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-generic-subtype-ruby-ci.sh "$(command -v ruby)" "$(command -v gem)"
      - name: Preserve complete and partial Ruby records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-subtype-ruby-${{ github.sha }}
          path: |
            build/generic-subtype-ruby-ci/
            build/generic-subtype-ruby-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Ruby acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  rust:
    name: Ordinary and reviewed generic Subtypes on Rust 1.90
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and package dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and pinned Lean and Rust toolchains
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/generic-subtype-rust-toolchain.log
          bash scripts/bootstrap-rust-ci.sh 2>&1 | tee -a build/generic-subtype-rust-toolchain.log
      - name: Execute source-free Rust acceptance
        id: acceptance
        timeout-minutes: 125
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-generic-subtype-rust-ci.sh "$PWD/.toolchains/rust-1.90.0/bin/rustc" "$PWD/.toolchains/rust-1.90.0/bin/cargo"
      - name: Preserve complete and partial Rust records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-subtype-rust-${{ github.sha }}
          path: |
            build/generic-subtype-rust-ci/
            build/generic-subtype-rust-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Rust acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
