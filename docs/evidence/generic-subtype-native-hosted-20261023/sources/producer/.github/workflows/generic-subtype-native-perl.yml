name: Generic Subtypes in C, C++ and Perl

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: generic-subtype-native-perl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependent-foundation:
    name: Dependent generic checked Subtype compiler and review contract
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libgmp-dev libuv1-dev m4 pkg-config
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/dependent-generic-subtype-toolchain.log
      - name: Verify dependent generic checked Subtypes
        id: acceptance
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          {
            node --test \
              tests/helpers/nominal-subtype-selection-tests.mjs \
              tests/helpers/nominal-subtype-native-tests.mjs \
              tests/helpers/dependent-generic-subtype-source-history-tests.mjs
            LEAN_BRIDGE_NOMINAL_SUBTYPE_SELECTION_TEST=1 \
              node --test --test-concurrency=1 \
              tests/helpers/nominal-subtype-selection-extractor-tests.mjs
            npm run typecheck
          } 2>&1 | tee build/dependent-generic-subtype.tap
      - name: Preserve complete and partial foundation records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependent-generic-subtype-${{ github.sha }}
          path: |
            build/dependent-generic-subtype.tap
            build/dependent-generic-subtype-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce dependent generic checked Subtype acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  native:
    name: Ordinary and reviewed generic Subtypes in C and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/generic-subtype-native-toolchain.log
      - name: Execute source-free C and C++ acceptance
        id: acceptance
        timeout-minutes: 125
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-generic-subtype-native-ci.sh
      - name: Preserve complete and partial native records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-subtype-native-${{ github.sha }}
          path: |
            build/generic-subtype-native-ci/
            build/generic-subtype-native-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed native acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  perl:
    name: Ordinary and reviewed generic Subtypes across four Perl ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    steps:
      - name: Free hosted runner disk before checkout
        shell: bash
        run: |
          set -euo pipefail
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Restore the checksummed Perl toolchain matrix
        uses: actions/cache@v4
        with:
          path: .toolchains/perl
          key: perl-checked-record-abi-v1-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
      - name: Install dependencies, Lean and four Perl ABIs
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/generic-subtype-perl-toolchain.log
          node scripts/build-perl-toolchains.mjs 5.36.3 threaded
          node scripts/build-perl-toolchains.mjs 5.36.3 unthreaded
          node scripts/build-perl-toolchains.mjs 5.38.2 threaded
          node scripts/build-perl-toolchains.mjs 5.38.2 unthreaded
      - name: Execute source-free CPAN acceptance
        id: acceptance
        timeout-minutes: 135
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-generic-subtype-perl-ci.sh
      - name: Preserve complete and partial Perl records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: generic-subtype-perl-${{ github.sha }}
          path: |
            build/generic-subtype-perl-ci/
            build/generic-subtype-perl-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Perl acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
