name: Installed callback Subtypes in remaining managed hosts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callback-subtype-remaining-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-subtype-remaining:
    name: Directional callback Subtypes in ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        lane: [dotnet, jvm, php-native, wit-wasi]
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select .NET 8
        if: matrix.lane == 'dotnet'
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/lean-bridge-callback-subtype-dotnet
        with:
          dotnet-version: '8.0.424'
      - name: Select Java 22
        if: matrix.lane == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22.0.2'
      - name: Install the checksummed Kotlin 2.2 compiler
        if: matrix.lane == 'jvm'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fL --retry 3 --output build/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          echo '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  build/kotlin-compiler.zip' | sha256sum --check
          unzip -q build/kotlin-compiler.zip -d build/kotlin-tools
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler, package and archive dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(build-essential cmake curl git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep unzip xz-utils zstd)
          if [[ '${{ matrix.lane }}' == jvm ]]; then packages+=(maven); fi
          if [[ '${{ matrix.lane }}' == php-native ]]; then
            packages+=(composer php-cli php-common php-dev php-mbstring php-zip)
          fi
          sudo apt-get install -y "${packages[@]}"
      - name: Install the documented Nix CLI
        if: matrix.lane == 'wit-wasi'
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.11/install
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/callback-subtype-remaining-${{ matrix.lane }}-toolchain.log
          if [[ '${{ matrix.lane }}' == wit-wasi ]]; then
            bash scripts/bootstrap-toolchains.sh --wasm-tools-only 2>&1 | tee -a build/callback-subtype-remaining-${{ matrix.lane }}-toolchain.log
          fi
      - name: Build the pinned Wasmtime C API
        if: matrix.lane == 'wit-wasi'
        timeout-minutes: 30
        shell: bash
        run: nix build .#wasmtime-c-api --out-link build/wasmtime-c-api
      - name: Require both callback directions and author routes
        id: acceptance
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          case '${{ matrix.lane }}' in
            dotnet)
              bash scripts/run-callback-subtype-remaining-ci.sh dotnet "$RUNNER_TEMP/lean-bridge-callback-subtype-dotnet/dotnet"
              ;;
            jvm)
              bash scripts/run-callback-subtype-remaining-ci.sh jvm \
                "$JAVA_HOME/bin/java" "$JAVA_HOME/bin/javac" \
                "$PWD/build/kotlin-tools/kotlinc/bin/kotlinc" "$(command -v mvn)"
              ;;
            php-native)
              bash scripts/run-callback-subtype-remaining-ci.sh php-native \
                "$(command -v php)" "$(command -v composer)"
              ;;
            wit-wasi)
              bash scripts/run-callback-subtype-remaining-ci.sh wit-wasi \
                "/usr/bin/cc" "$PWD/.toolchains/wasm-tools/bin/wasm-tools" \
                "$PWD/build/wasmtime-c-api"
              ;;
          esac
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callback-subtype-remaining-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/callback-subtype-remaining-ci-${{ matrix.lane }}/
            build/callback-subtype-remaining-${{ matrix.lane }}-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed callback Subtype acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
