name: Downstream consumer contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: consumer-contract-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  LEAN_BRIDGE_CONSUMER_PERFORMANCE_DIR: build/consumer-ci/performance

jobs:
  nix-cache:
    name: Signed Nix cache recipes
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install the documented Nix CLI
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.11/install
      - name: Execute the offline signing and loopback fetch acceptance
        run: npm run test:nix-cache

  documentation:
    name: Documentation contract
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Check documentation and the versioned support contract
        run: npm run test:docs

  node-consumers:
    name: Node and browser npm consumers
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install documentation browser engines
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Package and execute clean Node consumers
        id: consumer
        continue-on-error: true
        env:
          LEAN_BRIDGE_DOCUMENTATION_BROWSERS: chromium,firefox,webkit
        run: npm run test:consumer:node
      - name: Prepare the standalone CLI archive with its prebuilt runtime
        run: npm run build:cli-package -- --output build/cli-package --runtime build/consumer-ci-runtime/lazy
      - name: Compile locked and dependency-free projects and install relocated npm releases offline
        env:
          LEAN_BRIDGE_LAKE_WASM_TEST: "1"
          LEAN_BRIDGE_LAKE_GENERATED_PACKAGES_TEST: "1"
          LEAN_BRIDGE_LAKE_ENGINE: build/locked-lake-engine/bin/lean-bridge-component-engine
          LEAN_BRIDGE_LAKE_RUNTIME_ROOT: build/consumer-ci-runtime/lazy
        run: |
          nix build .#component-build-engine --out-link build/locked-lake-engine
          node --test tests/component-publication.test.mjs
          node --test tests/lake-wasm.test.mjs
          node --test tests/unlocked-component.test.mjs
          node --test --test-name-pattern='npm releases|publication dry run' tests/lake-generated-packages.test.mjs
      - name: Compare installed Node, browser, React and worker corpus packages with fresh Lean
        id: type_corpus_npm
        continue-on-error: true
        env:
          LEAN_BRIDGE_LAKE_ENGINE: build/locked-lake-engine/bin/lean-bridge-component-engine
          LEAN_BRIDGE_LAKE_RUNTIME_ROOT: build/consumer-ci-runtime/lazy
          LEAN_BRIDGE_TYPE_CORPUS_BROWSERS: chromium,firefox,webkit
        run: |
          bash scripts/bootstrap-toolchains.sh --lean-only
          npm run test:type-corpus:npm
      - name: Preserve installed npm corpus observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-corpus-npm-${{ github.sha }}
          path: build/type-corpus/browser-javascript-browser-react-browser-worker-node-javascript-node-typescript.json
          if-no-files-found: error
          retention-days: 30
      - name: Install C# for the combined native projection
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.424'
      - name: Install Java for the combined native projection
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22.0.2'
      - name: Install Ruby for the combined native projection
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
      - name: Build one captured API for npm, CPAN, C, C++, NuGet, Maven, RubyGems, WIT, PyPI, Cargo and PHP and execute installations
        env:
          LEAN_BRIDGE_MULTI_PROFILE_TEST: "1"
          LEAN_BRIDGE_LAKE_ENGINE: build/locked-lake-engine/bin/lean-bridge-component-engine
          LEAN_BRIDGE_LAKE_RUNTIME_ROOT: build/consumer-ci-runtime/lazy
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential libperl-dev pkg-config python3-venv php-cli php-common composer zstd
          bash scripts/bootstrap-toolchains.sh --lean-only
          bash scripts/bootstrap-toolchains.sh --wasm-tools-only
          bash scripts/bootstrap-rust-ci.sh
          export LEAN_BRIDGE_RUSTC="$PWD/.toolchains/rust-1.90.0/bin/rustc"
          export LEAN_BRIDGE_CARGO="$PWD/.toolchains/rust-1.90.0/bin/cargo"
          nix build .#wasmtime-c-api --out-link build/wasmtime-c-api
          export LEAN_BRIDGE_WASMTIME_C_API="$PWD/build/wasmtime-c-api"
          source scripts/env.sh
          node --test tests/multi-profile-project.test.mjs
      - name: Check documentation API captures through compiler-backed public analysis
        run: LEAN_BRIDGE_BUILD_BACKEND=nix node scripts/capture-reference-apis.mjs
      - name: Build and consume a Lean project through the tarball-installed CLI
        run: npm run acceptance:cli-package -- --candidate build/cli-package --output build/cli-package-acceptance --backend nix
      - name: Install the disposable npm registry
        run: npm install --prefix build/registry-tools --ignore-scripts --no-audit --no-fund verdaccio@6.2.0
      - name: Publish through the installed CLI and consume only the component
        run: >-
          node scripts/check-local-npm-release.mjs
          --verdaccio build/registry-tools/node_modules/.bin/verdaccio
          --candidate build/cli-package --output build/cli-registry-acceptance
          --backend nix --browsers chromium,firefox,webkit
      - name: Preserve the CLI candidate and installed-author evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cli-package-acceptance-${{ github.sha }}
          path: |
            build/cli-package/*.tgz
            build/cli-package/cli-package-report.json
            build/cli-package-acceptance
            build/cli-registry-acceptance
          if-no-files-found: warn
          retention-days: 30
      - name: Record Node observations
        if: always()
        shell: bash
        run: |
          test_result="${{ steps.consumer.outcome == 'success' && steps.type_corpus_npm.outcome == 'success' && 'passed' || 'failed' }}"
          executed="${{ steps.consumer.outcome == 'success' && steps.type_corpus_npm.outcome == 'success' && 'true' || 'false' }}"
          node scripts/consumer-ci.mjs record --consumer node-javascript --output build/consumer-ci/results/node-javascript.json --performance build/consumer-ci/performance/node-javascript.json --test-result "$test_result" --package-installation "$executed" --real-lean-execution "$executed" --command "npm run test:consumer:node && npm run test:type-corpus:npm"
          node scripts/consumer-ci.mjs record --consumer node-typescript --output build/consumer-ci/results/node-typescript.json --performance build/consumer-ci/performance/node-typescript.json --test-result "$test_result" --package-installation "$executed" --real-lean-execution "$executed" --command "npm run test:consumer:node && npm run test:type-corpus:npm"
      - name: Upload Node observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-node-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce Node support and the browser corpus
        if: steps.consumer.outcome != 'success' || steps.type_corpus_npm.outcome != 'success'
        run: exit 1
      - name: Preserve executable documentation observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: documentation-consumer-results-${{ github.sha }}
          path: build/documentation-consumer-acceptance
          if-no-files-found: warn
          retention-days: 30

  browser-consumer:
    name: Browser npm boundary
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies and browser
        run: |
          npm ci --ignore-scripts
          npx playwright install --with-deps chromium
      - name: Install the npm archive and execute real Lean in Chromium
        id: consumer
        continue-on-error: true
        run: npm run test:consumer:browser
      - name: Record browser observations
        if: always()
        shell: bash
        run: |
          test_result="${{ steps.consumer.outcome == 'success' && 'passed' || 'failed' }}"
          executed="${{ steps.consumer.outcome == 'success' && 'true' || 'false' }}"
          node scripts/consumer-ci.mjs record --consumer browser-javascript --output build/consumer-ci/results/browser-javascript.json --performance build/consumer-ci/performance/browser-javascript.json --test-result "$test_result" --package-installation "$executed" --real-lean-execution "$executed" --command "npm run test:consumer:browser"
      - name: Upload browser observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-browser-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce the browser boundary
        if: steps.consumer.outcome != 'success'
        run: exit 1

  php-consumers:
    name: Native PHP and PHP-Wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore pinned PHP and compiler inputs
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            build/php-wasm-sdk
            build/php-wasm-host
          key: consumer-php-${{ runner.os }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/bootstrap-toolchains.sh', 'scripts/bootstrap-php-wasm-ci.sh', 'poc/lean-link-spike/bindings/php-wasm.package.json') }}
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install native PHP and PHP-Wasm host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gperf libtool re2c cmake pkg-config php-cli php-common composer zstd
          bash scripts/bootstrap-php-wasm-ci.sh --check-prerequisites
      - name: Build ordinary PHP packages and execute relocated Composer installations
        id: ordinary_php
        continue-on-error: true
        env:
          LEAN_BRIDGE_NATIVE_PHP_TEST: "1"
        run: |
          bash scripts/bootstrap-toolchains.sh --lean-only
          source scripts/env.sh
          node --test tests/native-php.test.mjs
      - name: Build twice, install, and execute every PHP transport
        id: consumer
        continue-on-error: true
        run: npm run test:consumer:php
      - name: Exercise generic copied Zend conversions in 32-bit PHP-Wasm
        id: copied_zend
        continue-on-error: true
        env:
          LEAN_BRIDGE_PHP_WASM_ZEND_TEST: "1"
        run: |
          bash scripts/bootstrap-php-wasm-ci.sh
          node --test tests/php-copied-zend.test.mjs
      - name: Compile ordinary Lean APIs and execute installed PHP-Wasm packages
        id: ordinary_php_wasm
        continue-on-error: true
        env:
          LEAN_BRIDGE_PHP_WASM_ORDINARY_TEST: "1"
          LEAN_BRIDGE_PHP_WASM_BROWSER_TEST: "1"
          LEAN_WASM_RUNTIME_PROFILE: browser
          LEAN_WASM_RUNTIME_VARIANT: php-wasm-3.1.68
          LEAN_WASM_ARTIFACT_TARGET: php-wasm-emscripten-3.1.68
        run: |
          npx playwright install --with-deps chromium
          bash scripts/bootstrap-toolchains.sh
          export LEAN_WASM_EMSDK="$GITHUB_WORKSPACE/.toolchains/emsdk-php-wasm"
          bash scripts/build-lean-runtime.sh
          node --test tests/php-wasm-ordinary.test.mjs
      - name: Combine PHP-Wasm with native PHP and JavaScript from one captured API
        id: php_multi_profile
        continue-on-error: true
        env:
          LEAN_BRIDGE_PHP_MULTI_PROFILE_TEST: "1"
          LEAN_BRIDGE_LAKE_ENGINE: build/php-multi-engine/bin/lean-bridge-component-engine
          LEAN_BRIDGE_LAKE_RUNTIME_ROOT: build/php-multi-runtime/lazy
        run: |
          nix build .#universal-core-artifacts --out-link build/php-multi-runtime
          nix build .#component-build-engine --out-link build/php-multi-engine
          source scripts/env.sh
          node --test tests/php-wasm-multi-profile.test.mjs
      - name: Record PHP observations
        if: always()
        shell: bash
        run: |
          test_result="${{ steps.consumer.outcome == 'success' && 'passed' || 'failed' }}"
          executed="${{ steps.consumer.outcome == 'success' && 'true' || 'false' }}"
          native_result="$test_result"
          native_executed="$executed"
          if [ "${{ steps.ordinary_php.outcome }}" != success ]; then
            native_result=failed
            native_executed=false
          fi
          wasm_result="$test_result"
          wasm_executed="$executed"
          if [ "${{ steps.ordinary_php_wasm.outcome }}" != success ] || [ "${{ steps.copied_zend.outcome }}" != success ] || [ "${{ steps.php_multi_profile.outcome }}" != success ]; then
            wasm_result=failed
            wasm_executed=false
          fi
          node scripts/consumer-ci.mjs record --consumer php-native --output build/consumer-ci/results/php-native.json --performance build/consumer-ci/performance/php-native.json --test-result "$native_result" --package-installation "$native_executed" --real-lean-execution "$native_executed" --command "npm run test:consumer:php && LEAN_BRIDGE_NATIVE_PHP_TEST=1 node --test tests/native-php.test.mjs"
          node scripts/consumer-ci.mjs record --consumer php-wasm --output build/consumer-ci/results/php-wasm.json --performance build/consumer-ci/performance/php-wasm.json --test-result "$wasm_result" --package-installation "$wasm_executed" --real-lean-execution "$wasm_executed" --command "npm run test:consumer:php && LEAN_BRIDGE_PHP_WASM_ZEND_TEST=1 node --test tests/php-copied-zend.test.mjs && LEAN_BRIDGE_PHP_WASM_ORDINARY_TEST=1 LEAN_BRIDGE_PHP_WASM_BROWSER_TEST=1 node --test tests/php-wasm-ordinary.test.mjs && LEAN_BRIDGE_PHP_MULTI_PROFILE_TEST=1 node --test tests/php-wasm-multi-profile.test.mjs"
      - name: Upload PHP observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-php-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce PHP support
        if: steps.consumer.outcome != 'success' || steps.ordinary_php.outcome != 'success' || steps.copied_zend.outcome != 'success' || steps.ordinary_php_wasm.outcome != 'success' || steps.php_multi_profile.outcome != 'success'
        run: exit 1

  native-consumers:
    name: Python, Rust, C, and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install every package and execute real Lean
        id: consumer
        continue-on-error: true
        run: npm run test:consumer:native
      - name: Compile ordinary Lean APIs once for relocated C and C++ consumers
        env:
          LEAN_BRIDGE_NATIVE_C_TEST: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential cmake pkg-config zstd
          bash scripts/bootstrap-toolchains.sh --lean-only
          source scripts/env.sh
          node --test tests/native-c-family.test.mjs tests/native-c-copied.test.mjs
      - name: Build ordinary Lean APIs and install relocated Python wheels
        id: ordinary_python
        continue-on-error: true
        env:
          LEAN_BRIDGE_NATIVE_PYTHON_TEST: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y python3-venv
          source scripts/env.sh
          node --test tests/native-python.test.mjs
      - name: Compare installed Python corpus packages with fresh Lean results
        id: type_corpus_python
        continue-on-error: true
        run: |
          source scripts/env.sh
          npm run test:type-corpus:python
      - name: Upload the real-Lean type corpus report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-corpus-python-${{ github.sha }}
          path: build/type-corpus/python.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Build ordinary Lean APIs and execute relocated Cargo crates
        id: ordinary_rust
        continue-on-error: true
        env:
          LEAN_BRIDGE_NATIVE_RUST_TEST: "1"
        run: |
          bash scripts/bootstrap-rust-ci.sh
          export LEAN_BRIDGE_RUSTC="$PWD/.toolchains/rust-1.90.0/bin/rustc"
          export LEAN_BRIDGE_CARGO="$PWD/.toolchains/rust-1.90.0/bin/cargo"
          source scripts/env.sh
          node --test tests/native-rust.test.mjs
      - name: Compare isolated Cargo corpus consumers with fresh Lean
        id: type_corpus_rust
        continue-on-error: true
        run: |
          bash scripts/bootstrap-rust-ci.sh
          export LEAN_BRIDGE_RUSTC="$PWD/.toolchains/rust-1.90.0/bin/rustc"
          export LEAN_BRIDGE_CARGO="$PWD/.toolchains/rust-1.90.0/bin/cargo"
          source scripts/env.sh
          npm run test:type-corpus:rust
      - name: Upload installed Rust corpus observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-corpus-rust-${{ github.sha }}
          path: build/type-corpus/rust.json
          if-no-files-found: error
          retention-days: 30
      - name: Record native consumer observations
        if: always()
        shell: bash
        run: |
          test_result="${{ steps.consumer.outcome == 'success' && 'passed' || 'failed' }}"
          executed="${{ steps.consumer.outcome == 'success' && 'true' || 'false' }}"
          for consumer in python rust c cpp; do
            result="$test_result"
            installed="$executed"
            consumer_command="npm run test:consumer:native"
            if [ "$consumer" = python ]; then
              consumer_command="$consumer_command && LEAN_BRIDGE_NATIVE_PYTHON_TEST=1 node --test tests/native-python.test.mjs && npm run test:type-corpus:python"
              if [ "${{ steps.ordinary_python.outcome }}" != success ] || [ "${{ steps.type_corpus_python.outcome }}" != success ]; then
                result=failed
                installed=false
              fi
            fi
            if [ "$consumer" = rust ]; then
              consumer_command="$consumer_command && LEAN_BRIDGE_NATIVE_RUST_TEST=1 node --test tests/native-rust.test.mjs && npm run test:type-corpus:rust"
              if [ "${{ steps.ordinary_rust.outcome }}" != success ] || [ "${{ steps.type_corpus_rust.outcome }}" != success ]; then
                result=failed
                installed=false
              fi
            fi
            node scripts/consumer-ci.mjs record --consumer "$consumer" --output "build/consumer-ci/results/$consumer.json" --performance "build/consumer-ci/performance/$consumer.json" --test-result "$result" --package-installation "$installed" --real-lean-execution "$installed" --command "$consumer_command"
          done
      - name: Upload native consumer observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-native-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce native consumer support
        if: steps.consumer.outcome != 'success' || steps.ordinary_python.outcome != 'success' || steps.type_corpus_python.outcome != 'success' || steps.ordinary_rust.outcome != 'success' || steps.type_corpus_rust.outcome != 'success'
        run: exit 1

  managed-consumers:
    name: .NET, JVM, and Ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Restore packages and execute real Lean
        id: consumer
        continue-on-error: true
        run: npm run test:consumer:managed
      - name: Install the ordinary C# compiler
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.424'
      - name: Compile ordinary Lean APIs and install relocated NuGet releases
        id: ordinary_dotnet
        env:
          LEAN_BRIDGE_NATIVE_DOTNET_TEST: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential zstd
          bash scripts/bootstrap-toolchains.sh --lean-only
          source scripts/env.sh
          node --test tests/native-dotnet.test.mjs
      - name: Install the ordinary Java compiler
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22.0.2'
      - name: Compile ordinary Lean APIs and install Maven packages in Java and Kotlin
        id: ordinary_jvm
        env:
          LEAN_BRIDGE_NATIVE_JVM_TEST: "1"
        run: |
          sudo apt-get install -y maven unzip
          curl -fL --retry 3 --output build/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          echo '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  build/kotlin-compiler.zip' | sha256sum --check
          unzip -q build/kotlin-compiler.zip -d build/kotlin-tools
          export LEAN_BRIDGE_JAVAC="$JAVA_HOME/bin/javac"
          export LEAN_BRIDGE_JAVA="$JAVA_HOME/bin/java"
          export LEAN_BRIDGE_KOTLINC="$PWD/build/kotlin-tools/kotlinc/bin/kotlinc"
          export LEAN_BRIDGE_KOTLIN="$PWD/build/kotlin-tools/kotlinc/bin/kotlin"
          source scripts/env.sh
          node --test tests/native-jvm.test.mjs
      - name: Install the ordinary Ruby runtime
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
      - name: Build ordinary Lean APIs and install relocated RubyGems releases
        id: ordinary_ruby
        env:
          LEAN_BRIDGE_NATIVE_RUBY_TEST: "1"
        run: |
          export LEAN_BRIDGE_RUBY="$(command -v ruby)"
          export LEAN_BRIDGE_GEM="$(command -v gem)"
          source scripts/env.sh
          node --test tests/native-ruby.test.mjs
      - name: Compare installed Ruby corpus packages with fresh Lean results
        id: type_corpus_ruby
        continue-on-error: true
        run: |
          export LEAN_BRIDGE_RUBY="$(command -v ruby)"
          export LEAN_BRIDGE_GEM="$(command -v gem)"
          source scripts/env.sh
          npm run test:type-corpus:ruby
      - name: Upload the Ruby real-Lean type corpus report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: type-corpus-ruby-${{ github.sha }}
          path: build/type-corpus/ruby.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Record managed consumer observations
        if: always()
        shell: bash
        run: |
          for consumer in dotnet jvm ruby; do
            consumer_command="npm run test:consumer:managed"
            test_result="${{ steps.consumer.outcome == 'success' && 'passed' || 'failed' }}"
            executed="${{ steps.consumer.outcome == 'success' && 'true' || 'false' }}"
            if [ "$consumer" = dotnet ]; then
              consumer_command="$consumer_command && LEAN_BRIDGE_NATIVE_DOTNET_TEST=1 node --test tests/native-dotnet.test.mjs"
              if [ "${{ steps.ordinary_dotnet.outcome }}" != success ]; then
                test_result=failed
                executed=false
              fi
            fi
            if [ "$consumer" = jvm ]; then
              consumer_command="$consumer_command && LEAN_BRIDGE_NATIVE_JVM_TEST=1 node --test tests/native-jvm.test.mjs"
              if [ "${{ steps.ordinary_jvm.outcome }}" != success ]; then
                test_result=failed
                executed=false
              fi
            fi
            if [ "$consumer" = ruby ]; then
              consumer_command="$consumer_command && LEAN_BRIDGE_NATIVE_RUBY_TEST=1 node --test tests/native-ruby.test.mjs && npm run test:type-corpus:ruby"
              if [ "${{ steps.ordinary_ruby.outcome }}" != success ] || [ "${{ steps.type_corpus_ruby.outcome }}" != success ]; then
                test_result=failed
                executed=false
              fi
            fi
            node scripts/consumer-ci.mjs record --consumer "$consumer" --output "build/consumer-ci/results/$consumer.json" --performance "build/consumer-ci/performance/$consumer.json" --test-result "$test_result" --package-installation "$executed" --real-lean-execution "$executed" --command "$consumer_command"
          done
      - name: Upload managed consumer observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-managed-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce managed consumer support
        if: steps.consumer.outcome != 'success' || steps.type_corpus_ruby.outcome != 'success'
        run: exit 1

  wasi-consumer:
    name: WIT and WASI Component Model
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Install the archive and invoke the component through Wasmtime
        id: consumer
        continue-on-error: true
        run: npm run test:consumer:wasi
      - name: Compile ordinary Lean APIs and consume relocated WIT packages
        id: ordinary_wit
        env:
          LEAN_BRIDGE_NATIVE_WIT_TEST: "1"
        run: |
          sudo apt-get update && sudo apt-get install -y build-essential pkg-config zstd
          bash scripts/bootstrap-toolchains.sh --lean-only
          bash scripts/bootstrap-toolchains.sh --wasm-tools-only
          nix build .#wasmtime-c-api --out-link build/wasmtime-c-api
          export LEAN_BRIDGE_WASMTIME_C_API="$PWD/build/wasmtime-c-api"
          source scripts/env.sh
          node --test tests/native-wit.test.mjs
      - name: Record WIT and WASI observations
        if: always()
        shell: bash
        run: |
          test_result="${{ steps.consumer.outcome == 'success' && steps.ordinary_wit.outcome == 'success' && 'passed' || 'failed' }}"
          executed="${{ steps.consumer.outcome == 'success' && steps.ordinary_wit.outcome == 'success' && 'true' || 'false' }}"
          node scripts/consumer-ci.mjs record --consumer wit-wasi --output build/consumer-ci/results/wit-wasi.json --performance build/consumer-ci/performance/wit-wasi.json --test-result "$test_result" --package-installation "$executed" --real-lean-execution "$executed" --command "npm run test:consumer:wasi && LEAN_BRIDGE_NATIVE_WIT_TEST=1 node --test tests/native-wit.test.mjs"
      - name: Upload WIT and WASI observations
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-results-wasi-${{ github.sha }}
          path: build/consumer-ci/results/*.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce WIT and WASI support
        if: steps.consumer.outcome != 'success' || steps.ordinary_wit.outcome != 'success'
        run: exit 1

  docker-engine:
    name: Pinned Docker build path
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore pinned compiler toolchains
        uses: actions/cache@v5
        with:
          path: .toolchains
          key: consumer-docker-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-toolchains.sh', 'containers/builder/manifest.json', 'lean-toolchain') }}
      - name: Install dependencies and pinned toolchains
        run: |
          npm ci --ignore-scripts
          npm run bootstrap
      - name: Build the pinned builder image
        run: npm run build:builder-image
      - name: Check the mounted repository ownership boundary
        run: npm run test:builder-ownership
      - name: Execute the clean consumer through Docker
        env:
          LEAN_BRIDGE_BUILD_BACKEND: docker
        run: npm run test:consumer:docker-ci

  perl-consumer:
    name: Perl
    uses: ./.github/workflows/perl-consumer.yml

  support-summary:
    name: Publish consumer support summary
    if: always()
    needs:
      - documentation
      - nix-cache
      - node-consumers
      - browser-consumer
      - php-consumers
      - native-consumers
      - managed-consumers
      - perl-consumer
      - wasi-consumer
      - docker-engine
    runs-on: ubuntu-24.04
    steps:
      - name: Check out the support reporter
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Download consumer observations
        uses: actions/download-artifact@v5
        with:
          pattern: consumer-results-*-${{ github.sha }}
          path: build/consumer-ci/results
          merge-multiple: true
      - name: Validate all fourteen targets and publish the table
        run: node scripts/consumer-ci.mjs summary --results build/consumer-ci/results --output build/consumer-ci/report.json
      - name: Upload the combined support report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: consumer-support-report-${{ github.sha }}
          path: build/consumer-ci/report.json
          if-no-files-found: error
          overwrite: true
          retention-days: 30
