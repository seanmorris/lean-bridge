name: Installed primitive-base nominal Subtypes in native PHP

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-php:
    name: Four primitive-base nominal selections in native PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Retain every producer commit while materializing live source, the
          # authenticated transition record, and two immutable acceptance archives.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/type-surface.v1.json
            /docs/consumer-support.v1.json
            /docs/evidence/
            !/docs/evidence/*
            /docs/evidence/ci-contract-repair-source-history-20261017.json
            /docs/evidence/nominal-primitive-subtype-python-20261014/
            /docs/evidence/nominal-primitive-subtype-npm-20261014/
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler, PHP, Composer, and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake composer git jq libgmp-dev libuv1-dev m4 php-cli php-common php-dev php-mbstring php-zip pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/nominal-primitive-subtype-php-toolchain.log
      - name: Require both source routes and API modes in native PHP
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          php_command=$(command -v php)
          composer_command=$(command -v composer)
          bash scripts/run-nominal-primitive-subtype-php-ci.sh "$php_command" "$composer_command"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-php-${{ github.sha }}
          path: |
            build/nominal-primitive-subtype-php-ci/
            build/nominal-primitive-subtype-php-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed primitive-base native PHP acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
