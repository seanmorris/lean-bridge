name: Verified algorithm demos

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: demos-pages-${{ github.ref }}
  cancel-in-progress: true

env:
  # Keep this identical to Consumer Matrix's authenticated documentation input
  # closure. The gallery checks current docs and defers retained-history replay
  # to Core and Consumer Matrix.
  LEAN_BRIDGE_DOCUMENTATION_SPARSE_CHECKOUT: |
    /*
    !/*/
    /.github/
    /acceptance/
    /config/
    /containers/
    /demos/
    /nix/
    /notices/
    /patches/
    /poc/
    /schema/
    /scripts/
    /site/
    /src/
    /tests/
    /docs/
    !/docs/evidence/*
    /docs/evidence/*.json
    /docs/evidence/*.md
    /docs/evidence/*.xml
    /docs/evidence/**/*.json
    /docs/evidence/**/*.md
    /docs/evidence/**/*.xml
    /docs/evidence/checked-records-20261008/
    /docs/evidence/checked-record-perl-installed-20261011/
    /docs/evidence/checked-record-browser-20261011/
    /docs/evidence/checked-record-php-wasm-20261011/
    /docs/evidence/checked-record-python-hosts-20261010/
    /docs/evidence/checked-record-ruby-jvm-20261010/
    /docs/evidence/checked-record-remaining-hosts-20261010/
    /docs/evidence/native-fin-callbacks-20261008/
    /docs/evidence/browser-callback-fin-20261008/
    /docs/evidence/reviewed-callback-fin-20261008/
    /docs/evidence/reviewed-subtype-python-hosts-20261010/
    /docs/evidence/reviewed-subtype-ruby-jvm-hosts-20261010/
    /docs/evidence/reviewed-subtype-remaining-hosts-20261010/
    /docs/evidence/php-wasm-subtype-installed-20261010/

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      LEAN_BRIDGE_SITE_BASE: /lean-bridge/
    steps:
      - name: Free hosted runner disk before bounded documentation checkout
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          filter: blob:none
          persist-credentials: false
          sparse-checkout: ${{ env.LEAN_BRIDGE_DOCUMENTATION_SPARSE_CHECKOUT }}
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.23.2
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Check the React site and canonical documentation
        env:
          LEAN_BRIDGE_RETAINED_CONTRACTS: deferred
        run: npm run site:typecheck && npm run site:test
      - name: Bootstrap pinned Lean and Wasm toolchains
        run: npm run bootstrap
      - name: Check documentation snippets and author contracts
        env:
          LEAN_BRIDGE_RETAINED_CONTRACTS: deferred
        run: npm run test:docs:demo
      - name: Check the tutorial proof and reject unsound variants
        run: npm run test:docs:proof
      - name: Build and verify demo artifacts
        run: npm run demos:verify
      - name: Reject stale generated artifacts
        run: git diff --exit-code -- demos
      - name: Assemble the static site
        run: npm run demos:site
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install browser audit engines
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium firefox webkit
      - name: Audit the assembled gallery in three browser engines
        env:
          DEMO_BROWSERS: chromium,firefox,webkit
        run: npm run demos:browser
      - name: Audit static documentation and React navigation
        env:
          SITE_BROWSERS: chromium,firefox,webkit
        run: npm run site:browser
      - name: Package the exact checked Pages inventory
        run: npm run demos:archive
      - name: Preserve browser audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: demo-browser-audit
          path: |
            build/demo-browser-audit
            build/react-site-audit
            build/documentation-site-audit
            build/pages-artifact/pages-artifact.json
          if-no-files-found: ignore
          retention-days: 30
      - name: Configure GitHub Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: github-pages
          path: build/pages-artifact/artifact.tar
          if-no-files-found: error
          retention-days: 30

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy verified demo artifact
        id: deployment
        uses: actions/deploy-pages@v4
