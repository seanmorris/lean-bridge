name: Installed primitive-base nominal Subtypes in WIT and WASI components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-wit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-wit:
    name: Four primitive-base nominal selections through Wasmtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install the documented Nix CLI
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.11/install
      - name: Install dependencies, the pinned Lean compiler and wasm-tools
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/nominal-primitive-subtype-wit-toolchain.log
          bash scripts/bootstrap-toolchains.sh --wasm-tools-only 2>&1 | tee -a build/nominal-primitive-subtype-wit-toolchain.log
      - name: Build the pinned Wasmtime C API
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          nix build .#wasmtime-c-api --out-link build/wasmtime-c-api
      - name: Require both source routes and API modes through Wasmtime
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-primitive-subtype-wit-ci.sh "/usr/bin/cc" "$PWD/.toolchains/wasm-tools/bin/wasm-tools" "$PWD/build/wasmtime-c-api"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-wit-${{ github.sha }}
          path: |
            build/nominal-primitive-subtype-wit-ci/
            build/nominal-primitive-subtype-wit-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed primitive-base WIT acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
