name: Value-indexed checked records in C and C++

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 1 * * 1"

permissions:
  contents: read

concurrency:
  group: checked-record-value-index-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checked-record-value-index-native:
    name: Four value-index routes in C11/GMP and C++20/Boost
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/checked-record-value-index-native-toolchain.log
      - name: Require every author route and API mode in C and C++
        id: acceptance
        timeout-minutes: 180
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-checked-record-value-index-native-ci.sh
      - name: Preserve complete and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: checked-record-value-index-native-${{ github.sha }}
          path: |
            build/checked-record-value-index-native-ci/
            build/checked-record-value-index-native-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce value-index native acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
