name: Zero-payload checked records in Ruby

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 19 * * 6"

permissions:
  contents: read

concurrency:
  group: zero-payload-checked-record-ruby-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zero-payload-checked-record-ruby:
    name: Four zero-payload checked-record routes in Ruby
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select Ruby 3.3
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3.12'
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/zero-payload-checked-record-ruby-toolchain.log
      - name: Require every source route and API mode in Ruby
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          ruby_command=$(command -v ruby)
          gem_command=$(command -v gem)
          bash scripts/run-zero-payload-checked-record-ruby-ci.sh "$ruby_command" "$gem_command"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zero-payload-checked-record-ruby-${{ github.sha }}
          path: |
            build/zero-payload-checked-record-ruby-ci/
            build/zero-payload-checked-record-ruby-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed zero-payload Ruby acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
