name: Dependent checked-record checked records in WIT and WASI components

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependent-checked-record-wit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependent-checked-record-wit:
    name: Four dependent checked-record checked-record routes through Wasmtime
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies, the pinned Lean compiler and wasm-tools
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/dependent-checked-record-wit-toolchain.log
          bash scripts/bootstrap-toolchains.sh --wasm-tools-only 2>&1 | tee -a build/dependent-checked-record-wit-toolchain.log
      - name: Build the pinned Wasmtime C API
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          (
            set -euo pipefail
            test "$(uname -sm)" = 'Linux x86_64'
            mkdir -p build
            test ! -e build/wasmtime-c-api && test ! -L build/wasmtime-c-api
            WASMTIME_CAPI_STAGING=$(mktemp -d build/wasmtime-c-api.XXXXXX)
            trap 'rm -rf -- "$WASMTIME_CAPI_STAGING"' EXIT
            curl --fail --location --retry 3 --retry-delay 2 --connect-timeout 20 --max-time 300 \
              --output "$WASMTIME_CAPI_STAGING/wasmtime.tar.xz" \
              'https://github.com/bytecodealliance/wasmtime/releases/download/v42.0.1/wasmtime-v42.0.1-x86_64-linux-c-api.tar.xz'
            echo '2097a47351918a446b26c7e65f487278f63bc947591b71897db547cd90c05082'"  $WASMTIME_CAPI_STAGING/wasmtime.tar.xz" | sha256sum --check --status
            mkdir "$WASMTIME_CAPI_STAGING/unpacked"
            tar -xJf "$WASMTIME_CAPI_STAGING/wasmtime.tar.xz" --strip-components=1 -C "$WASMTIME_CAPI_STAGING/unpacked"
            test -s "$WASMTIME_CAPI_STAGING/unpacked/include/wasmtime.h"
            test -s "$WASMTIME_CAPI_STAGING/unpacked/include/wasm.h"
            test -s "$WASMTIME_CAPI_STAGING/unpacked/lib/libwasmtime.so"
            test -s "$WASMTIME_CAPI_STAGING/unpacked/lib/libwasmtime.a"
            mv -T "$WASMTIME_CAPI_STAGING/unpacked" build/wasmtime-c-api
          )
      - name: Require both source routes and API modes through Wasmtime
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-dependent-checked-record-wit-ci.sh "/usr/bin/cc" "$PWD/.toolchains/wasm-tools/bin/wasm-tools" "$PWD/build/wasmtime-c-api"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependent-checked-record-wit-${{ github.sha }}
          path: |
            build/dependent-checked-record-wit-ci/
            build/dependent-checked-record-wit-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed dependent checked-record checked-record WIT acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
