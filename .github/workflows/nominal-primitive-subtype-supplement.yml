name: Supplemental primitive-base nominal Subtype caller replay

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-supplement-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-supplement:
    name: Replay strict constructors and variant refusals from archived packages
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Retain every producer commit while materializing live source, the
          # authenticated transition record, and two immutable acceptance archives.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/type-surface.v1.json
            /docs/consumer-support.v1.json
            /docs/evidence/
            !/docs/evidence/*
            /docs/evidence/ci-contract-repair-source-history-20261017.json
            /docs/evidence/nominal-primitive-subtype-python-20261014/
            /docs/evidence/nominal-primitive-subtype-npm-20261014/
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select Python 3.11
        id: python311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select Python 3.12
        id: python312
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install replay dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv unzip
          npm ci --ignore-scripts --no-audit --no-fund
      - name: Install Chromium, Firefox and WebKit
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium firefox webkit
      - name: Replay the supplemental callers from authenticated archives
        id: acceptance
        timeout-minutes: 120
        env:
          LEAN_BRIDGE_NOMINAL_PRIMITIVE_SUBTYPE_SUPPLEMENT_TEST: "1"
          LEAN_BRIDGE_NOMINAL_PRIMITIVE_SUBTYPE_SUPPLEMENT_OUTPUT: build/nominal-primitive-subtype-supplement
          SUPPLEMENT_PYTHON_311: ${{ steps.python311.outputs.python-path }}
          SUPPLEMENT_PYTHON_312: ${{ steps.python312.outputs.python-path }}
          LEAN_BRIDGE_NOMINAL_PRIMITIVE_SUBTYPE_PYTHONS: >-
            {"3.11":"${{ steps.python311.outputs.python-path }}","3.12":"${{ steps.python312.outputs.python-path }}"}
          LEAN_BRIDGE_TYPE_CORPUS_BROWSERS: chromium,firefox,webkit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/nominal-primitive-subtype-supplement
          {
            printf 'revision='; git rev-parse HEAD
            printf 'node='; node --version
            printf 'npm='; npm --version
            printf 'python-3.11='; "$SUPPLEMENT_PYTHON_311" --version
            printf 'python-3.12='; "$SUPPLEMENT_PYTHON_312" --version
            printf 'glibc='; ldd --version | sed -n '1p'
          } > build/nominal-primitive-subtype-supplement/tools.txt
          node --test --test-concurrency=1 --test-reporter=tap \
            tests/helpers/nominal-primitive-subtype-supplement-caller-tests.mjs \
            tests/helpers/nominal-primitive-subtype-supplement-installed-tests.mjs \
            2>&1 | tee build/nominal-primitive-subtype-supplement/run.tap
      - name: Preserve original and partial supplemental records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-supplement-${{ github.sha }}
          path: build/nominal-primitive-subtype-supplement/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce the supplemental installed replay
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
