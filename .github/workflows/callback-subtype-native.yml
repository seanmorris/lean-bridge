name: Installed callback Subtypes in C and C++

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: callback-subtype-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-subtype-native:
    name: Directional callback Subtypes in installed C and C++ packages
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/callback-subtype-native-toolchain.log
      - name: Require both directions and author routes in C and C++
        id: acceptance
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-callback-subtype-native-ci.sh
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callback-subtype-native-${{ github.sha }}
          path: |
            build/callback-subtype-native-ci/
            build/callback-subtype-native-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed native callback Subtype acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
