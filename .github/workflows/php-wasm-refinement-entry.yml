name: Nominal and recursive refinement entry in PHP-Wasm

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 16 * * 5"
  workflow_call:

permissions:
  contents: read

concurrency:
  group: php-wasm-refinement-entry-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  entry-probe:
    name: ${{ matrix.family }} ${{ matrix.route }} graph entries
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        family:
          - nominal-full
          - nominal-result-only
          - recursive-subtype
          - recursive-checked-record
        route:
          - ordinary
          - reviewed
    env:
      EMCC_CORES: "2"
      LEAN_WASM_RUNTIME_PROFILE: browser
      LEAN_WASM_RUNTIME_VARIANT: php-wasm-3.1.68
      LEAN_WASM_ARTIFACT_TARGET: php-wasm-emscripten-3.1.68
    steps:
      - name: Check out the exact revision and evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore pinned PHP and compiler inputs
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            build/php-wasm-sdk
            build/php-wasm-host
          key: php-wasm-refinement-entry-${{ runner.os }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/bootstrap-toolchains.sh', 'scripts/bootstrap-php-wasm-ci.sh', 'poc/lean-link-spike/bindings/php-wasm.package.json') }}
      - name: Install dependencies without lifecycle scripts
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gperf libtool re2c cmake pkg-config php-cli php-dev php-common php-zip php-mbstring composer zstd ripgrep
          bash scripts/bootstrap-php-wasm-ci.sh --check-prerequisites
      - name: Disable host PHP debugging instrumentation
        run: |
          if /usr/bin/php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'; then
            sudo phpdismod -s cli xdebug
          fi
          env -i PATH=/usr/bin:/bin /usr/bin/php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Consumer PHP must run without Xdebug.\n"); exit(1); }'
      - name: Install Chromium
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium
      - name: Check the observer before provisioning the runtime
        run: |
          node --test --test-concurrency=1 \
            tests/helpers/php-wasm-entry-probe-deployment-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-callers-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-selection-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-source-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-build-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-driver-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-plan-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-report-tests.mjs \
            tests/helpers/php-wasm-refinement-entry-ci-tests.mjs
      - name: Build the pinned PHP-Wasm runtime inputs
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/bootstrap-php-wasm-ci.sh 2>&1 | tee build/php-wasm-refinement-entry-host.log
          bash scripts/bootstrap-toolchains.sh
          export LEAN_WASM_EMSDK="$GITHUB_WORKSPACE/.toolchains/emsdk-php-wasm"
          bash scripts/build-lean-runtime.sh 2>&1 | tee build/php-wasm-refinement-entry-runtime.log
          source scripts/env.sh
          node --input-type=module -e 'import {prepareOwnedPhpWasmRuntime} from "./tests/helpers/owned-php-wasm-runtime.mjs"; await prepareOwnedPhpWasmRuntime("build/php-wasm-refinement-entry-input");'
          test -s build/php-wasm-refinement-entry-input/php-wasm-runtime/runtime.json
      - name: Reproduce, install and execute the selected graph probe
        id: acceptance
        timeout-minutes: 180
        env:
          LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME: build/php-wasm-refinement-entry-input/php-wasm-runtime
          LEAN_BRIDGE_REFINEMENT_ENTRY_PHP_WASM_TEST: "1"
          LEAN_BRIDGE_REFINEMENT_ENTRY_PHP_WASM_FAMILIES: ${{ matrix.family }}
          LEAN_BRIDGE_REFINEMENT_ENTRY_PHP_WASM_ROUTES: ${{ matrix.route }}
          LEAN_BRIDGE_REFINEMENT_ENTRY_PHP_WASM_OUTPUT: build/php-wasm-refinement-entry-ci
          LEAN_BRIDGE_PHP_WASM_FAILED_DEPLOYMENTS: build/php-wasm-refinement-entry-failed-deployments
        run: |
          source scripts/env.sh
          bash scripts/run-php-wasm-refinement-entry-ci.sh
      - name: Preserve original and partial compiler-input records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: php-wasm-refinement-entry-${{ matrix.family }}-${{ matrix.route }}-${{ github.sha }}
          path: |
            build/php-wasm-refinement-entry-ci/
            build/php-wasm-refinement-entry-ci.tap
            build/php-wasm-refinement-entry-host.log
            build/php-wasm-refinement-entry-runtime.log
            build/php-wasm-refinement-entry-input/php-wasm-runtime/runtime.json
            build/php-wasm-refinement-entry-failed-deployments/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce graph entry production
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
