name: Installed owned Subtypes in remaining managed hosts

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-subtype-remaining-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-subtype-remaining:
    name: Checked owned aggregates in ${{ matrix.lane }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    strategy:
      fail-fast: false
      matrix:
        lane: [dotnet, jvm, php-native, wit-wasi]
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select .NET 8
        if: matrix.lane == 'dotnet'
        uses: actions/setup-dotnet@v6
        env:
          DOTNET_INSTALL_DIR: ${{ runner.temp }}/lean-bridge-owned-subtype-dotnet
        with:
          dotnet-version: '8.0.424'
      - name: Select Java 22
        if: matrix.lane == 'jvm'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22.0.2'
      - name: Install the checksummed Kotlin 2.2 compiler
        if: matrix.lane == 'jvm'
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          curl -fL --retry 3 --output build/kotlin-compiler.zip https://github.com/JetBrains/kotlin/releases/download/v2.2.0/kotlin-compiler-2.2.0.zip
          echo '1adb6f1a5845ba0aa5a59e412e44c8e405236b957de1a9683619f1dca3b16932  build/kotlin-compiler.zip' | sha256sum --check
          unzip -q build/kotlin-compiler.zip -d build/kotlin-tools
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler, package and archive dependencies
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          packages=(build-essential cmake curl git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep unzip xz-utils zstd)
          if [[ '${{ matrix.lane }}' == jvm ]]; then packages+=(maven); fi
          if [[ '${{ matrix.lane }}' == php-native ]]; then
            packages+=(composer php-cli php-common php-dev php-mbstring php-zip)
          fi
          sudo apt-get install -y "${packages[@]}"
      - name: Install the documented Nix CLI
        if: matrix.lane == 'wit-wasi'
        uses: cachix/install-nix-action@v31
        with:
          install_url: https://releases.nixos.org/nix/nix-2.24.11/install
      - name: Install dependencies and pinned Lean tools
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/owned-subtype-remaining-${{ matrix.lane }}-toolchain.log
          if [[ '${{ matrix.lane }}' == wit-wasi ]]; then
            bash scripts/bootstrap-toolchains.sh --wasm-tools-only 2>&1 | tee -a build/owned-subtype-remaining-${{ matrix.lane }}-toolchain.log
          fi
      - name: Build the pinned Wasmtime C API
        if: matrix.lane == 'wit-wasi'
        timeout-minutes: 30
        shell: bash
        run: nix build .#wasmtime-c-api --out-link build/wasmtime-c-api
      - name: Require both author routes and relocated installed consumers
        id: acceptance
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          export LEAN_BRIDGE_OWNED_SUBTYPE_REMAINING_PROFILE='${{ matrix.lane }}'
          case '${{ matrix.lane }}' in
            dotnet)
              export LEAN_BRIDGE_DOTNET="$RUNNER_TEMP/lean-bridge-owned-subtype-dotnet/dotnet"
              ;;
            jvm)
              export LEAN_BRIDGE_JAVA="$JAVA_HOME/bin/java"
              export LEAN_BRIDGE_JAVAC="$JAVA_HOME/bin/javac"
              export LEAN_BRIDGE_KOTLINC="$PWD/build/kotlin-tools/kotlinc/bin/kotlinc"
              export LEAN_BRIDGE_MAVEN="$(command -v mvn)"
              ;;
            php-native)
              export LEAN_BRIDGE_PHP="$(command -v php)"
              export LEAN_BRIDGE_COMPOSER="$(command -v composer)"
              ;;
            wit-wasi)
              export CC=/usr/bin/cc
              export LEAN_BRIDGE_WASM_TOOLS="$PWD/.toolchains/wasm-tools/bin/wasm-tools"
              export LEAN_BRIDGE_WASMTIME_C_API="$PWD/build/wasmtime-c-api"
              ;;
          esac
          npm run test:owned-subtype-remaining 2>&1 | tee build/owned-subtype-remaining-${{ matrix.lane }}.log
          rg '^# fail 0$' build/owned-subtype-remaining-${{ matrix.lane }}.log
          rg '^# skipped 0$' build/owned-subtype-remaining-${{ matrix.lane }}.log
          test -s build/owned-subtype-remaining-packaging/${{ matrix.lane }}.json
          test -s build/owned-subtype-remaining-packaging/retained-packages.json
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-subtype-remaining-${{ matrix.lane }}-${{ github.sha }}
          path: |
            build/owned-subtype-remaining-${{ matrix.lane }}.log
            build/owned-subtype-remaining-${{ matrix.lane }}-toolchain.log
            build/owned-subtype-remaining-packaging/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed owned Subtype acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
