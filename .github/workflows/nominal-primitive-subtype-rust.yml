name: Installed primitive-base nominal Subtypes in Rust

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-rust-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-rust:
    name: Four primitive-base nominal selections in Rust
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Retain every producer commit while materializing only live source
          # and the two immutable archives read by this acceptance cohort.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/type-surface.v1.json
            /docs/consumer-support.v1.json
            /docs/evidence/
            !/docs/evidence/*
            /docs/evidence/nominal-primitive-subtype-python-20261014/
            /docs/evidence/nominal-primitive-subtype-npm-20261014/
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and pinned Lean and Rust compilers
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/nominal-primitive-subtype-rust-toolchain.log
          bash scripts/bootstrap-rust-ci.sh 2>&1 | tee -a build/nominal-primitive-subtype-rust-toolchain.log
      - name: Require both source routes and API modes in Rust
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-primitive-subtype-rust-ci.sh "$PWD/.toolchains/rust-1.90.0/bin/rustc" "$PWD/.toolchains/rust-1.90.0/bin/cargo"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-rust-${{ github.sha }}
          path: |
            build/nominal-primitive-subtype-rust-ci/
            build/nominal-primitive-subtype-rust-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed primitive-base Rust acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
