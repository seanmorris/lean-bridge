name: Installed callback checked records in Perl

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 4 * * 0"

permissions:
  contents: read

concurrency:
  group: callback-checked-record-perl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  callback-checked-record-perl:
    name: Directional callback checked records on all four Perl ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          # The producer uses current source/package bytes only. Exclude the
          # 41+ GiB immutable evidence corpus and publication inventory.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/consumer-support.v1.json
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install the checkout dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install the native build tools
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y build-essential curl zstd
      - name: Restore the pinned Lean compiler
        uses: actions/cache@v5
        with:
          path: |
            .toolchains/downloads
            .toolchains/elan
            .toolchains/elan-installer
          key: lean-toolchain-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'scripts/bootstrap-toolchains.sh') }}
      - name: Install only the pinned Lean compiler
        timeout-minutes: 25
        run: bash scripts/bootstrap-toolchains.sh --lean-only
      - name: Restore the complete checksummed Perl toolchain matrix
        uses: actions/cache@v5
        with:
          path: .toolchains/perl
          key: perl-callback-abi-v2-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
          restore-keys: perl-callback-checked-record-abi-v1-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
      - name: Build or verify every pinned Perl interpreter
        run: |
          node scripts/build-perl-toolchains.mjs 5.36.3 threaded
          node scripts/build-perl-toolchains.mjs 5.36.3 unthreaded
          node scripts/build-perl-toolchains.mjs 5.38.2 threaded
          node scripts/build-perl-toolchains.mjs 5.38.2 unthreaded
      - name: Require both directions, author routes and install modes
        id: acceptance
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-callback-checked-record-perl-ci.sh
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callback-checked-record-perl-${{ github.sha }}
          path: build/callback-checked-record-perl-ci/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Perl callback checked-record acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  callback-fin-perl:
    name: Checked Fin callbacks on all four Perl ABIs
    needs: callback-checked-record-perl
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false
          # Match the established job's complete executable checkout without
          # materializing publication-only evidence or the type-surface index.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/consumer-support.v1.json
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install the checkout dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install the native build tools
        timeout-minutes: 20
        run: sudo apt-get update && sudo apt-get install -y build-essential curl zstd
      - name: Restore the pinned Lean compiler
        uses: actions/cache@v5
        with:
          path: |
            .toolchains/downloads
            .toolchains/elan
            .toolchains/elan-installer
          key: lean-toolchain-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'scripts/bootstrap-toolchains.sh') }}
      - name: Install only the pinned Lean compiler
        timeout-minutes: 25
        run: bash scripts/bootstrap-toolchains.sh --lean-only
      - name: Restore the complete checksummed Perl toolchain matrix
        uses: actions/cache@v5
        with:
          path: .toolchains/perl
          key: perl-callback-abi-v2-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
          restore-keys: perl-callback-checked-record-abi-v1-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
      - name: Build or verify every pinned Perl interpreter
        run: |
          node scripts/build-perl-toolchains.mjs 5.36.3 threaded
          node scripts/build-perl-toolchains.mjs 5.36.3 unthreaded
          node scripts/build-perl-toolchains.mjs 5.38.2 threaded
          node scripts/build-perl-toolchains.mjs 5.38.2 unthreaded
      - name: Require author routes and install modes
        id: acceptance
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-callback-fin-perl-ci.sh
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: callback-fin-perl-${{ github.sha }}
          path: build/callback-fin-perl-ci/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Perl callback Fin acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
