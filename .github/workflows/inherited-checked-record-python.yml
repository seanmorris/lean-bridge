name: Installed inherited checked records in Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: inherited-checked-record-python-${{ github.ref }}
  cancel-in-progress: true

jobs:
  inherited-checked-record-python:
    name: Four inherited checked-record selections on both Python floors
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Select Python 3.11
        id: python311
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Select Python 3.12
        id: python312
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git libgmp-dev libuv1-dev m4 pkg-config python3-venv ripgrep unzip xz-utils zip zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/inherited-checked-record-python-toolchain.log
      - name: Require both source routes and API modes on both Python floors
        id: acceptance
        timeout-minutes: 120
        shell: bash
        env:
          INHERITED_PYTHON_311: ${{ steps.python311.outputs.python-path }}
          INHERITED_PYTHON_312: ${{ steps.python312.outputs.python-path }}
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-inherited-checked-record-python-ci.sh "$INHERITED_PYTHON_311" "$INHERITED_PYTHON_312"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: inherited-checked-record-python-${{ github.sha }}
          path: |
            build/inherited-checked-record-python-ci/
            build/inherited-checked-record-python-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed inherited checked-record Python acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
