name: Core quality contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: core-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - name: Restore pinned wasm-tools
        uses: actions/cache@v5
        with:
          path: |
            .toolchains/downloads/wasm-tools-*.tar.gz
            .toolchains/wasm-tools
          key: core-wasm-tools-${{ runner.os }}-${{ hashFiles('scripts/bootstrap-toolchains.sh') }}
      - name: Install pinned wasm-tools
        run: bash scripts/bootstrap-toolchains.sh --wasm-tools-only
      - name: Install dependencies without lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Run lint, checked JavaScript, documentation, and contract tests
        run: |
          source scripts/env.sh
          npm run check:core
