name: Installed owned checked records in native and Perl consumers

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 1 * * 5"

permissions:
  contents: read

concurrency:
  group: owned-checked-record-native-perl-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: Ordinary and reviewed owned checked records in C and C++
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and pinned Lean
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build/owned-checked-record-native-ci
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/owned-checked-record-native-ci/toolchain.log
      - name: Compile complete owned checked-record carriers
        timeout-minutes: 5
        env:
          LEAN_BRIDGE_ELABORATED_METADATA_TEST: "1"
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          node --max-old-space-size=512 --test --test-name-pattern='^(complete owned checked-record carriers|reviewed owned callback carriers elaborate)' tests/owned-checked-record-foundation.test.mjs 2>&1 | tee build/owned-checked-record-foundation.tap
          rg '^# tests 2$' build/owned-checked-record-foundation.tap
          rg '^# pass 2$' build/owned-checked-record-foundation.tap
          rg '^# fail 0$' build/owned-checked-record-foundation.tap
          rg '^# skipped 0$' build/owned-checked-record-foundation.tap
      - name: Execute source-free C and C++ acceptance
        id: acceptance
        timeout-minutes: 130
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          npm run test:owned-checked-record-native 2>&1 | tee build/owned-checked-record-native-ci/acceptance.log
          rg '^# fail 0$' build/owned-checked-record-native-ci/acceptance.log
          rg '^# skipped 0$' build/owned-checked-record-native-ci/acceptance.log
          test -s build/owned-checked-record-native-packaging/report.json
          for route in ordinary-full ordinary-result-only reviewed-full reviewed-result-only; do
            test -s "build/owned-checked-record-native-packaging/evidence/$route/handoff/package-set-receipt.json"
          done
      - name: Preserve native acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-checked-record-native-${{ github.sha }}
          path: |
            build/owned-checked-record-native-ci/
            build/owned-checked-record-native-packaging/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed native acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1

  perl:
    name: Ordinary and reviewed owned checked records across four Perl ABIs
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake curl git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Restore the checksummed Perl toolchain matrix
        uses: actions/cache@v4
        with:
          path: .toolchains/perl
          key: perl-owned-checked-record-v1-${{ runner.os }}-${{ hashFiles('scripts/build-perl-toolchains.mjs') }}
      - name: Install dependencies, Lean and four Perl ABIs
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build/owned-checked-record-perl-ci
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/owned-checked-record-perl-ci/toolchain.log
          node scripts/build-perl-toolchains.mjs 5.36.3 threaded
          node scripts/build-perl-toolchains.mjs 5.36.3 unthreaded
          node scripts/build-perl-toolchains.mjs 5.38.2 threaded
          node scripts/build-perl-toolchains.mjs 5.38.2 unthreaded
      - name: Execute source-free CPAN acceptance
        id: acceptance
        timeout-minutes: 220
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          npm run test:owned-checked-record-perl 2>&1 | tee build/owned-checked-record-perl-ci/acceptance.log
          rg '^# fail 0$' build/owned-checked-record-perl-ci/acceptance.log
          rg '^# skipped 0$' build/owned-checked-record-perl-ci/acceptance.log
          test -s build/owned-checked-record-perl-packaging/report.json
          for route in ordinary-full ordinary-result-only reviewed-full reviewed-result-only; do
            test -s "build/owned-checked-record-perl-packaging/evidence/$route/handoff/package-set-receipt.json"
          done
      - name: Preserve Perl acceptance evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-checked-record-perl-${{ github.sha }}
          path: |
            build/owned-checked-record-perl-ci/
            build/owned-checked-record-perl-packaging/
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed Perl acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
