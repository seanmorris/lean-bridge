name: Dependent checked-record checked records in native PHP

on:
  workflow_dispatch:
  workflow_call:
    inputs:
      shallow_checkout:
        description: Use an exact depth-one checkout for focused package execution
        required: false
        default: false
        type: boolean
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 22 * * 1"

permissions:
  contents: read

concurrency:
  group: dependent-checked-record-php-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependent-checked-record-php:
    name: Four dependent checked-record checked-record routes in native PHP
    runs-on: ubuntu-24.04
    timeout-minutes: 210
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact package revision
        uses: actions/checkout@v6
        with:
          fetch-depth: ${{ inputs.shallow_checkout && 1 || 0 }}
          persist-credentials: false
          # Producers require current package source, not the immutable hosted
          # evidence corpus. Keep root files and every source/build directory,
          # while materializing only the small top-level evidence records.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/evidence/*
            /docs/evidence/*.json
            /docs/evidence/*.md
            /docs/evidence/*.xml
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler, PHP, Composer, and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake composer git jq libgmp-dev libuv1-dev m4 php-cli php-common php-dev php-mbstring php-zip pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/dependent-checked-record-php-toolchain.log
      - name: Require every source route and API mode in native PHP
        id: acceptance
        timeout-minutes: 150
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          php_command=$(command -v php)
          composer_command=$(command -v composer)
          bash scripts/run-dependent-checked-record-php-ci.sh "$php_command" "$composer_command"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependent-checked-record-php-${{ github.sha }}
          path: |
            build/dependent-checked-record-php-ci/
            build/dependent-checked-record-php-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed dependent checked-record native PHP acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
