name: Installed owned checked records in PHP-Wasm

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: owned-checked-record-php-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  owned-checked-record-php-wasm:
    name: Owned checked records in PHP-Wasm
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EMCC_CORES: "2"
      LEAN_NUM_THREADS: "1"
      LEAN_WASM_RUNTIME_PROFILE: browser
      LEAN_WASM_RUNTIME_VARIANT: php-wasm-3.1.68
      LEAN_WASM_ARTIFACT_TARGET: php-wasm-emscripten-3.1.68
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore pinned PHP and compiler inputs
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            build/php-wasm-sdk
            build/php-wasm-host
          key: owned-checked-record-php-wasm-${{ runner.os }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/bootstrap-toolchains.sh', 'scripts/bootstrap-php-wasm-ci.sh', 'poc/lean-link-spike/bindings/php-wasm.package.json') }}
      - name: Install dependencies without lifecycle scripts
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install PHP and compiler dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gperf libtool re2c cmake pkg-config php-cli php-dev php-common php-zip php-mbstring composer zstd ripgrep
          bash scripts/bootstrap-php-wasm-ci.sh --check-prerequisites
      - name: Disable host PHP debugging instrumentation
        run: |
          if /usr/bin/php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'; then
            sudo phpdismod -s cli xdebug
          fi
          env -i PATH=/usr/bin:/bin /usr/bin/php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Consumer PHP must run without Xdebug.\n"); exit(1); }'
      - name: Install Chromium
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium
      - name: Build the pinned PHP-Wasm runtime and host
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/bootstrap-php-wasm-ci.sh 2>&1 | tee build/owned-checked-record-php-wasm-host.log
          bash scripts/bootstrap-toolchains.sh
          export LEAN_WASM_EMSDK="$GITHUB_WORKSPACE/.toolchains/emsdk-php-wasm"
          bash scripts/build-lean-runtime.sh 2>&1 | tee build/owned-checked-record-php-wasm-runtime.log
          source scripts/env.sh
          node --input-type=module -e 'import {prepareOwnedPhpWasmRuntime} from "./tests/helpers/owned-php-wasm-runtime.mjs"; await prepareOwnedPhpWasmRuntime("build/owned-checked-record-php-wasm-input");'
          test -s build/owned-checked-record-php-wasm-input/php-wasm-runtime/runtime.json
      - name: Require ordinary and reviewed full and result-only packages
        id: acceptance
        timeout-minutes: 90
        env:
          LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME: build/owned-checked-record-php-wasm-input/php-wasm-runtime
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          npm run test:owned-checked-record-php-wasm 2>&1 | tee build/owned-checked-record-php-wasm.log
          rg '^# fail 0$' build/owned-checked-record-php-wasm.log
          rg '^# skipped 0$' build/owned-checked-record-php-wasm.log
          test -s build/owned-checked-record-php-wasm/packages.json
          test -s build/owned-checked-record-php-wasm/full.json
          test -s build/owned-checked-record-php-wasm/result-only.json
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: owned-checked-record-php-wasm-${{ github.sha }}
          path: |
            build/owned-checked-record-php-wasm.log
            build/owned-checked-record-php-wasm-host.log
            build/owned-checked-record-php-wasm-runtime.log
            build/owned-checked-record-php-wasm/packages.json
            build/owned-checked-record-php-wasm/full.json
            build/owned-checked-record-php-wasm/result-only.json
            build/owned-checked-record-php-wasm/evidence
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed owned checked-record acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
