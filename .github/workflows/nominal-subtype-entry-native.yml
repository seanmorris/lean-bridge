name: Nominal Subtype entry measurement in C and C++

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "47 19 * * 4"

permissions:
  contents: read

concurrency:
  group: nominal-subtype-entry-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-subtype-entry-native:
    name: Constructor and source entry in C with explicit C++ classification
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          node --test tests/helpers/nominal-subtype-dispatch-tests.mjs
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/nominal-subtype-entry-native-toolchain.log
      - name: Measure both source routes and classify both API modes
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-subtype-entry-native-ci.sh
      - name: Preserve original and partial measurement records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-subtype-entry-native-${{ github.sha }}
          path: |
            build/nominal-subtype-entry-native-ci/
            build/nominal-subtype-entry-native-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed entry measurement
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
