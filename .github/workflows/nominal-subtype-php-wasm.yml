name: Installed nominal Subtypes in PHP-Wasm

on:
  workflow_call:
    inputs:
      optional_parameters:
        description: Run the complete optional-parameter package matrix.
        required: false
        type: boolean
        default: false
      direct_proof_erasure:
        description: Run direct proof-erasure package acceptance.
        required: false
        type: boolean
        default: false
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "17 21 * * 4"

permissions:
  contents: read

concurrency:
  group: nominal-subtype-php-wasm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-subtype-php-wasm:
    name: Four nominal Subtype selections in PHP-Wasm
    runs-on: ubuntu-24.04
    # Keep the four nominal routes separate from the value and refinement corpus lanes.
    timeout-minutes: 360
    env:
      EMCC_CORES: "2"
      LEAN_WASM_RUNTIME_PROFILE: browser
      LEAN_WASM_RUNTIME_VARIANT: php-wasm-3.1.68
      LEAN_WASM_ARTIFACT_TARGET: php-wasm-emscripten-3.1.68
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Restore pinned PHP and compiler inputs
        uses: actions/cache@v5
        with:
          path: |
            .toolchains
            build/php-wasm-sdk
            build/php-wasm-host
          key: nominal-subtype-php-wasm-${{ runner.os }}-${{ hashFiles('flake.lock', 'lean-toolchain', 'scripts/bootstrap-toolchains.sh', 'scripts/bootstrap-php-wasm-ci.sh', 'poc/lean-link-spike/bindings/php-wasm.package.json') }}
      - name: Install dependencies without lifecycle scripts
        timeout-minutes: 20
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install PHP and compiler dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential autoconf automake bison flex gperf libtool re2c cmake pkg-config php-cli php-dev php-common php-zip php-mbstring composer zstd ripgrep
          bash scripts/bootstrap-php-wasm-ci.sh --check-prerequisites
      - name: Disable host PHP debugging instrumentation
        run: |
          if /usr/bin/php -r 'exit(extension_loaded("xdebug") ? 0 : 1);'; then
            sudo phpdismod -s cli xdebug
          fi
          env -i PATH=/usr/bin:/bin /usr/bin/php -r 'if (extension_loaded("xdebug")) { fwrite(STDERR, "Consumer PHP must run without Xdebug.\n"); exit(1); }'
      - name: Install Chromium
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium
      - name: Build the pinned PHP-Wasm runtime and host
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/bootstrap-php-wasm-ci.sh 2>&1 | tee build/nominal-subtype-php-wasm-host.log
          bash scripts/bootstrap-toolchains.sh
          export LEAN_WASM_EMSDK="$GITHUB_WORKSPACE/.toolchains/emsdk-php-wasm"
          bash scripts/build-lean-runtime.sh 2>&1 | tee build/nominal-subtype-php-wasm-runtime.log
          source scripts/env.sh
          node --input-type=module -e 'import {prepareOwnedPhpWasmRuntime} from "./tests/helpers/owned-php-wasm-runtime.mjs"; await prepareOwnedPhpWasmRuntime("build/nominal-subtype-php-wasm-input");'
          test -s build/nominal-subtype-php-wasm-input/php-wasm-runtime/runtime.json
      - name: Require ordinary, reviewed and both result-only installed packages
        id: acceptance
        timeout-minutes: 100
        env:
          LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME: build/nominal-subtype-php-wasm-input/php-wasm-runtime
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-subtype-php-wasm-ci.sh
          LEAN_BRIDGE_SIGNATURE_SPECIALIZATION_PHP_WASM_TEST=1 \
          LEAN_BRIDGE_SIGNATURE_SPECIALIZATION_PHP_WASM_REPORT=build/nominal-subtype-php-wasm-ci/signature-specializations.json \
            node --test --test-concurrency=1 \
              --test-name-pattern='^installed ordinary and reviewed PHP-Wasm packages execute selected instances in every loading arrangement$' \
              tests/reviewed-specializations.test.mjs
          test -s build/nominal-subtype-php-wasm-ci/signature-specializations.json
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-subtype-php-wasm-${{ github.sha }}
          path: |
            build/nominal-subtype-php-wasm-ci/
            build/nominal-subtype-php-wasm-host.log
            build/nominal-subtype-php-wasm-runtime.log
            build/nominal-subtype-php-wasm-input/php-wasm-runtime/runtime.json
          if-no-files-found: error
          retention-days: 30
      - name: Execute optional parameters through native PHP and PHP-Wasm packages
        id: optional_parameters
        if: inputs.optional_parameters
        continue-on-error: true
        timeout-minutes: 125
        env:
          LEAN_BRIDGE_PHP: /usr/bin/php
          LEAN_BRIDGE_COMPOSER: /usr/bin/composer
          LEAN_BRIDGE_PHP_EMSDK: ${{ github.workspace }}/.toolchains/emsdk-php-wasm
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          export LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME="$GITHUB_WORKSPACE/build/nominal-subtype-php-wasm-input/php-wasm-runtime"
          test -d "$LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME"
          bash scripts/run-optional-parameter-php-ci.sh
      - name: Preserve optional-parameter PHP records
        if: always() && inputs.optional_parameters
        uses: actions/upload-artifact@v7
        with:
          name: optional-parameter-php-${{ github.sha }}
          path: build/optional-parameter-php-ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce optional-parameter PHP acceptance
        if: always() && inputs.optional_parameters && steps.optional_parameters.outcome != 'success'
        run: exit 1
      - name: Qualify direct proof erasure in native PHP and PHP-Wasm packages
        id: direct_proof_erasure
        if: inputs.direct_proof_erasure
        continue-on-error: true
        timeout-minutes: 125
        env:
          LEAN_BRIDGE_PHP: /usr/bin/php
          LEAN_BRIDGE_COMPOSER: /usr/bin/composer
          LEAN_BRIDGE_PHP_EMSDK: ${{ github.workspace }}/.toolchains/emsdk-php-wasm
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          export LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME="$GITHUB_WORKSPACE/build/nominal-subtype-php-wasm-input/php-wasm-runtime"
          test -d "$LEAN_BRIDGE_TEST_PHP_COPIED_RUNTIME"
          bash scripts/run-direct-proof-erasure-php-ci.sh
      - name: Upload direct proof-erasure PHP evidence
        if: always() && inputs.direct_proof_erasure
        uses: actions/upload-artifact@v7
        with:
          name: direct-proof-erasure-php-${{ github.sha }}
          path: build/direct-proof-erasure-php-ci/
          if-no-files-found: error
          overwrite: true
          retention-days: 30
      - name: Enforce PHP support
        if: always() && inputs.direct_proof_erasure && steps.direct_proof_erasure.outcome != 'success'
        run: exit 1
      - name: Enforce installed PHP-Wasm acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
