name: Installed primitive-base nominal Subtypes in browsers

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-browser-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-browser:
    name: Four primitive-base nominal Subtype selections in Node and three browsers
    runs-on: ubuntu-24.04
    # Keep runtime preparation and this matrix outside the existing long Node job.
    timeout-minutes: 180
    env:
      EMCC_CORES: "2"
      LEAN_BRIDGE_LAKE_ENGINE: build/locked-lake-engine/bin/lean-bridge-component-engine
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Retain every producer commit while materializing live source, the
          # authenticated transition record, and two immutable acceptance archives.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/type-surface.v1.json
            /docs/consumer-support.v1.json
            /docs/evidence/
            !/docs/evidence/*
            /docs/evidence/ci-contract-repair-source-history-20261017.json
            /docs/evidence/nominal-primitive-subtype-python-20261014/
            /docs/evidence/nominal-primitive-subtype-npm-20261014/
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Install Nix
        uses: cachix/install-nix-action@v31
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev pkg-config python3 ripgrep xz-utils zstd
      - name: Install dependencies and pinned compiler tools
        timeout-minutes: 30
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          node --test --test-name-pattern='Nix component engine source boundary|filtered Nix engine' tests/engine-execution-request.test.mjs
          bash scripts/bootstrap-toolchains.sh
      - name: Install Chromium, Firefox and WebKit
        timeout-minutes: 20
        run: bash scripts/install-playwright-browsers.sh chromium firefox webkit
      - name: Build the locked component engine
        timeout-minutes: 40
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          nix build .#component-build-engine --out-link build/locked-lake-engine 2>&1 | tee build/nominal-primitive-subtype-browser-engine.log
          test -x build/locked-lake-engine/bin/lean-bridge-component-engine
      - name: Build the pinned shared Wasm runtime
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-lean-link-spike.sh 2>&1 | tee build/nominal-primitive-subtype-browser-runtime.log
          test -s build/lean-link-spike/lazy/main.wasm
      - name: Require both source routes and both primitive-base nominal API modes
        id: acceptance
        timeout-minutes: 90
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-primitive-subtype-browser-ci.sh "$PWD/build/lean-link-spike/lazy"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-browser-${{ github.sha }}
          path: |
            build/nominal-primitive-subtype-browser-ci/
            build/nominal-primitive-subtype-browser-engine.log
            build/nominal-primitive-subtype-browser-runtime.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed primitive-base browser acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
