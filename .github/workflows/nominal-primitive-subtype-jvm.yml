name: Installed primitive-base nominal Subtypes in Java and Kotlin

on:
  workflow_dispatch:
  # One lane in the bounded weekly default-branch acceptance sweep.
  schedule:
    - cron: "17 0 * * 4"

permissions:
  contents: read

concurrency:
  group: nominal-primitive-subtype-jvm-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nominal-primitive-subtype-jvm:
    name: Four primitive-base nominal selections in Java and Kotlin
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      LEAN_NUM_THREADS: "1"
    steps:
      - name: Check out the exact revision and original evidence history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false
          # Retain every producer commit while materializing live source, the
          # authenticated transition records, and two immutable acceptance archives.
          sparse-checkout: |
            /*
            !/*/
            /.github/
            /acceptance/
            /config/
            /containers/
            /demos/
            /nix/
            /notices/
            /patches/
            /poc/
            /schema/
            /scripts/
            /site/
            /src/
            /tests/
            /docs/
            !/docs/*
            /docs/type-surface.v1.json
            /docs/consumer-support.v1.json
            /docs/evidence/
            !/docs/evidence/*
            /docs/evidence/ci-contract-repair-source-history-20261017.json
            /docs/evidence/optional-parameter-dispatch-bridge-source-history-20261029.json
            /docs/evidence/optional-parameter-focused-ci-source-history-20261029.json
            /docs/evidence/optional-parameter-current-line-integration-source-history-20261029.json
            /docs/evidence/optional-parameter-source-history-20261028.json
            /docs/evidence/core-historical-evidence-reuse-live-pin-repair-source-history-20261027.json
            /docs/evidence/core-exact-head-hosted-static-repair-source-history-20261027.json
            /docs/evidence/core-exact-head-hosted-replay-repair-source-history-20261027.json
            /docs/evidence/core-inherited-record-type-surface-batch-source-history-20261027.json
            /docs/evidence/core-recursive-callable-evidence-pin-repair-source-history-20261027.json
            /docs/evidence/core-recursive-callable-replay-bound-source-history-20261027.json
            /docs/evidence/core-legacy-owned-evidence-replay-bound-source-history-20261027.json
            /docs/evidence/core-callback-evidence-replay-bound-source-history-20261027.json
            /docs/evidence/core-inherited-record-replay-bound-source-history-20261027.json
            /docs/evidence/core-replay-integration-endpoint-repair-source-history-20261027.json
            /docs/evidence/core-exact-head-replay-repair-source-history-20261027.json
            /docs/evidence/recurring-acceptance-documentation-source-history-20261027.json
            /docs/evidence/bounded-recurring-acceptance-sweep-source-history-20261027.json
            /docs/evidence/core-exact-head-validation-repair-source-history-20261027.json
            /docs/evidence/default-branch-ci-trigger-budget-source-history-20261027.json
            /docs/evidence/nominal-primitive-subtype-python-20261014/
            /docs/evidence/nominal-primitive-subtype-npm-20261014/
          sparse-checkout-cone-mode: false
      - name: Install Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
      - name: Bound apt network waits
        uses: ./.github/actions/bounded-apt
        timeout-minutes: 1
      - name: Install compiler and archive dependencies
        timeout-minutes: 20
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake git jq libgmp-dev libuv1-dev m4 pkg-config ripgrep unzip xz-utils zstd
      - name: Install dependencies and the pinned Lean compiler
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          npm ci --ignore-scripts --no-audit --no-fund
          mkdir -p build
          bash scripts/bootstrap-toolchains.sh --lean-only 2>&1 | tee build/nominal-primitive-subtype-jvm-toolchain.log
      - name: Select Java 22
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '22.0.2'
      - name: Install the checksummed Kotlin 2.2.0 compiler
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build
          bash scripts/download-pinned-release-asset.sh kotlin-compiler "build/kotlin-compiler.zip"
          unzip -q build/kotlin-compiler.zip -d build/kotlin-tools
      - name: Require both source routes and API modes in Java and Kotlin
        id: acceptance
        timeout-minutes: 120
        shell: bash
        run: |
          set -euo pipefail
          source scripts/env.sh
          bash scripts/run-nominal-primitive-subtype-jvm-ci.sh "$JAVA_HOME/bin/java" "$JAVA_HOME/bin/javac" "$PWD/build/kotlin-tools/kotlinc/bin/kotlinc"
      - name: Preserve original and partial installed records
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: nominal-primitive-subtype-jvm-${{ github.sha }}
          path: |
            build/nominal-primitive-subtype-jvm-ci/
            build/nominal-primitive-subtype-jvm-toolchain.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce installed primitive-base Java and Kotlin acceptance
        if: always() && steps.acceptance.outcome != 'success'
        run: exit 1
